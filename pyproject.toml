[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "readability-meter"
version = "0.1.0"
description = "Compute Flesch, Flesch-Kincaid, Gunning Fog and SMOG readability scores for manuscripts."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "JANIN A APURBA", email = "japurba97@gmail.com"}]
keywords = ["research", "automation", "reproducibility", "academic"]
dependencies = []

[project.scripts]
readability-meter = "readability_meter.cli:main"

[tool.setuptools]
packages = ["readability_meter"]
